<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 150 }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128187;</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="crt-overlay" aria-hidden="true"></div>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-prompt">&gt;</span> mchx-cs<span class="cursor">_</span>
      </a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}#writeups">writeups</a>
        <a href="{{ '/about/' | relative_url }}">about</a>
        <a href="https://github.com/mchx-cs" target="_blank" rel="noopener">github</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p><span class="prompt">mchx-cs@wonderland</span><span class="colon">:</span><span class="path">~</span><span class="dollar">$</span> echo "made with jekyll, coffee and burp suite"</p>
      <p class="muted">&copy; {{ site.time | date: '%Y' }} Clément Monchaux — mchx-cs</p>
    </div>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
